# wof-server on Fly.io. Deploy from the wof-solver directory:
#   fly deploy . --config server/fly.toml --dockerfile server/Dockerfile --remote-only --ha=false
app = "wof-solver"
primary_region = "iad"

[env]
  MIN_P = "0.99"
  CORS_ORIGINS = "https://danheskett.com,https://www.danheskett.com,http://localhost:8000"

[http_service]
  internal_port = 8080
  force_https = true
  # suspend, not stop: a suspended machine answers again in about 1 s, a
  # stopped one has to read the image and the weights again first
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

# The float16 weights (118 MB) are mapped from the image, so they sit in the
# page cache. The server's own memory (key/value cache, smart-solve's word
# list) is about 30 MB.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
